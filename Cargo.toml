[workspace]
members = ["macros"]
exclude = ["tests/external_consumer"]

[package]
name = "lower-ir-utils"
version = "0.2.0"
edition = "2021"
authors = ["Gonçalo Carvalho"]
description = "Helpers for mapping Rust types to Cranelift JIT signatures, lowering call arguments, and reducing module boilerplate."
license = "MIT"
readme = "README.md"
repository = "https://github.com/glslang/lower-ir-utils"
keywords = ["cranelift", "jit", "codegen", "ir"]
categories = ["development-tools", "compilers"]

[package.metadata.docs.rs]
all-features = true

[features]
# Enables the `disasm` module: side-by-side machine-code / mnemonic dumps of
# JIT-compiled functions. Pulls in `capstone` (the same disassembler
# Cranelift itself uses behind its own `disas` feature).
disas = ["dep:capstone"]
# Enables the `sim` module: a small Cranelift IR interpreter that walks a
# finalized `Function` against a flat byte buffer, then prints memory,
# the SSA register table, and final return values. No extra deps.
sim = []
# Enables the `external::chrono` module: `JitParam`/`JitArg` wrappers for
# `chrono`'s naive date/time types (`JitNaiveDate`, `JitNaiveTime`,
# `JitNaiveDateTime`). Pulls in `chrono` with default features off.
chrono = ["dep:chrono"]

[dependencies]
cranelift = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.132"
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
smallvec = "1"
lower-ir-utils-macros = { path = "macros", version = "0.2.0" }
capstone = { version = "0.14", optional = true }
chrono = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
cranelift-native = "0.131"
